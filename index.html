<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist-Manutenção de motos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Div principal reponsavél por dar a estrutura para a tela e para tudo que está dentro.-->
    <div class="painel-oficina">
        <!--Responsável pelo retângulo laranja que fica no lado superior, usado para elegância e para combinar com o tema.-->
        <div class="fundo-oficina"></div>

        <!--Tela principal do aplicativo.-->
        <div class="tela-aplicativo tela-garagem">

            <!--Botão de menu, foto de perfil e logo.-->
            <div class="topo-oficina">
                <div class="botao-menu-oficina">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings">
                    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
                    <circle cx="12" cy="12" r="3"/></svg>
                </div>
                
                <!--Div responsável pelas configurações do icone de perfil canto superior direito-->
                <div class="foto-perfil-usuario">
                    <img src="img/boy.png" alt="Foto de perfil">
                </div>

                <!--Div que envolve as configurações de icone e logo-->
                <div class="cabecalho-boas-vindas">
                    
                    <!--Div responsável por deixar a logo e o icone nos seus devidos lugares e nos tamanhos certos.-->
                    <div class="moldura-icone-oficina">
                        <img src="img/mechanic.png" alt="Logotipo">
                    </div>

                    <!--Div responsável pela logo.-->
                    <div class="logo-motobox">
                        <img src="img/motobox logo.png" alt="Logo Motobox" class="logo-cabecalho">
                    </div>
                </div>
            </div>
            
            <!--Div responsável pelas informações e o menu dos três pontinhos que está em cada bloco criado.-->
            <div class="area-dentro-bloco">
                
                <!-- Área que deixa um bloco sempre na incialização do aplicativo, para demostração -->
                <div class="grade-motos">
                    
                    <!--Div pai que modifica o bloco.-->
                    <div class="bloco-moto" data-id="trabalho">
                        <div class="icone-moto-lateral">
                            <img src="img/motorbike.png" alt="Ícone moto">
                            <div class="dados-revisoes-moto">
                                <h1>Suzuki</h1>
                                <p class="nome-mecanico-bloco">Mecânico: Ademir</p>
                                <p class="contador-revisoes-pendentes">1 revisão</p>
                            </div>
                        </div>
                        <div class="opcoes-gerenciamento-moto">
                            <div class="botao-tres-pontos">
                                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000c22" 
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis-vertical-icon lucide-ellipsis-vertical">
                                    <circle cx="12" cy="12" r="1"/>
                                    <circle cx="12" cy="5" r="1"/>
                                    <circle cx="12" cy="19" r="1"/>
                                </svg>
                            </div>
                            <!--Divi responsável pela informação Editar e Excluir que está dentro dos três pontinhos.-->
                            <div class="menu-pontos-flutuante">
                                <button class="acao-editar-moto">Editar</button>
                                <button class="acao-excluir-moto">Excluir</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Tela dos blocos criados das motos que precisam fazer as revisões -->
        <div class="tela-aplicativo tela-detalhes-revisao">
            <div class="seta-voltar">
                <div class="botao-seta-voltar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#000c22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-undo2-icon lucide-undo-2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                </div>
            </div>

            <div class="cabecalho-moto-selecionada">
                <img id="categoria-img" src="img/motorbike.png" alt="Ícone moto"> 
                <div class="especificacoes-moto">
                    <p id="categoria-mecanico" class="mecanico-cabecalho-detalhes">Mecânico: Ademir</p>
                    <h1 id="categoria-titulo">Suzuki</h1>
                    <p id="categoria-qtd">1 Revisão</p>
                </div>
            </div>
            
            <!-- Área responsável por criar e gerenciar as tarefas (checklist) criadas -->
            <div class="caixa-checklist-revisao">
                <div class="lista-itens-revisao">
                </div>
            </div>
        </div>

        <!-- Elemento gráfico do (lapis no caderninho) para o botão flutuante de adicionar (Blocos e tarefas) -->
        <div class="botao-adicionar-checklist">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
        </div>

        <!-- Área de criação do novo bloco -->
        <div class="overlay-janela janela-novo-bloco" id="janela-novo-bloco">
            <div class="caixa-dialogo-bloco">
                <p><strong> Digite o nome da nova moto:</strong></p><br>
                <input type="text" id="input-nome-bloco" placeholder="Digite aqui."><br>
                <p><strong> Digite o nome do mecânico:</strong></p><br>
                <input type="text" id="input-mecanico-bloco" placeholder="Ex: João Silva"><br>
                <div class="botoes-confirmacao">
                    <button id="btn-cancelar-bloco" class="botao-cancelar-operacao">Cancelar</button>
                    <button id="btn-confirmar-bloco" class="botao-confirmar-operacao">Criar</button>
                </div>
            </div>
        </div>
        <!--Div responsável pela edição dos blocos criados, mudando o nome do bloco e o nome do mecânico-->
        <div class="overlay-janela janela-editar-bloco" id="janela-editar-bloco">
            <div class="caixa-dialogo-bloco">
                <h3>Editar Moto</h3>
                <p>Nome da moto:</p>
                <input type="text" id="input-editar-nome-bloco" placeholder="Digite o nome da moto"><br>
                
                <p>Nome do mecânico:</p>
                <input type="text" id="input-editar-mecanico-bloco" placeholder="Digite o nome do mecânico"><br>

                <div class="botoes-confirmacao">
                    <button id="btn-cancelar-editar-bloco" class="botao-cancelar-operacao">Cancelar</button>
                    <button id="btn-confirmar-editar-bloco" class="botao-confirmar-operacao">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Área para poder escolher a fonte desejada (light ou bold) -->
        <div class="overlay-janela janela-alterar-fonte" id="alterar-configurações">
            <div class="caixa-dialogo-fontes">
                <h3>Estilo da Fonte</h3>
                <p>Escolha o estilo desejado:</p>
                <div class="grupo-opcoes-fonte">
                    <label>
                        <input type="radio" name="estilo-fonte" value="arial-normal" checked> Inter Normal
                    </label>
                    <label>
                        <input type="radio" name="estilo-fonte" value="arial-negrito"> Inter Negrito
                    </label>
                </div>
                <div class="botoes-confirmacao">
                    <button id="btn-fechar-config" class="botao-confirmar-operacao">Fechar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
